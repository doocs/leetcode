name: prettier-check

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.php'
      - '**/*.sql'
      - '**/*.md'
      - .prettierignore
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/prettier-check.yml
      - .github/scripts/fetch-diff-base.sh

concurrency:
  # Prefer PR number: github.ref can be the base branch and collide with push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch diff base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/fetch-diff-base.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check prettier
        run: |
          set -euo pipefail
          git config core.quotepath false
          mapfile -t files < <(git -c core.quotepath=false diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" -- '*.js' '*.ts' '*.php' '*.sql' '*.md' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Prettier files changed."
            exit 0
          fi
          pnpm exec prettier --check "${files[@]}"
