name: gofmt-linter

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - run_format.py
      - .github/workflows/gofmt-lint.yml
      - .github/scripts/fetch-diff-base.sh
  pull_request:
    paths:
      - '**/*.go'
      - run_format.py
      - .github/workflows/gofmt-lint.yml
      - .github/scripts/fetch-diff-base.sh

concurrency:
  # Prefer PR number: github.ref can be the base branch and collide with push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch diff base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/fetch-diff-base.sh
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check gofmt
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" -- '*.go' || true)
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              echo "No previous commit; skip gofmt."
              exit 0
            fi
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$before" "${{ github.sha }}" -- '*.go' || true)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi
          python run_format.py --check-gofmt "${files[@]}"
