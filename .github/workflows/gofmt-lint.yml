name: gofmt-linter

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - run_format.py
      - .github/workflows/gofmt-lint.yml
  pull_request:
    paths:
      - '**/*.go'
      - run_format.py
      - .github/workflows/gofmt-lint.yml

concurrency:
  group: ${{ github.workflow }} - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check gofmt
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" -- '*.go' || true)
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              echo "No previous commit; skip gofmt."
              exit 0
            fi
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$before" "${{ github.sha }}" -- '*.go' || true)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Go files changed."
            exit 0
          fi
          python run_format.py --check-gofmt "${files[@]}"
