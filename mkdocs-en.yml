INHERIT: mkdocs.yml
site_url: https://leetcode.doocs.org/en
site_description: LeetCode solutions in any programming language
site_dir: site/en
docs_dir: docs-en
copyright: Copyright &copy; 2026 <a href="https://github.com/doocs">Doocs</a><br>This work is licensed under a <a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">Creative Commons Attribution-ShareAlike 4.0 International License</a>.
theme:
  favicon: favicon.ico
  language: en
  font:
    text: Roboto
    code: Roboto Mono
extra:
  analytics:
    provider: google
    property: G-F887EV7L8E
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page.


# rewritten by build_site.py during site build
nav:
  - Home: index.md
  - Focused Training: tags.md

