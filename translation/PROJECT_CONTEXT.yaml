# Canonical project configuration. Paths are relative to the repository root.
schema_version: 1
base_version: 1.0.0
context_revision: 1
status: ready
project:
  id: leetcode-vi
  title: "LeetCode Wiki (doocs/leetcode) — bản tiếng Việt"
  audience: "Developer đọc lời giải thuật toán bằng tiếng Việt"
  source_languages: [en]
  target_language: vi-VN
source:
  kind: repo-docs
  location: "repo root (fork vandunxg/leetcode of doocs/leetcode)"
  revision:
    kind: git-commit
    value: 9377c61562a4097e96d48eed152b07dc411c1d17 # main at bootstrap; each unit report pins its own source blob
  edition_or_version: "doocs/leetcode main (English READMEs)"
  scope_include:
    - solution/*/*/README_EN.md
    - lcci/*/README_EN.md
  scope_exclude:
    - locator: solution/README_EN.md, lcci/README_EN.md
      reason: "Generated index lists, not problem pages (also skipped by upstream build_site.py)."
      approval: PROJECT-006
    - locator: "solution/CONTEST_README_EN.md, solution/summary_en.md"
      reason: "Generated lists; the vi site links to the originals."
      approval: PROJECT-006
    - locator: "lcof/**, lcof2/**, lcp/**, lcs/**, */README.md (Chinese)"
      reason: "No English source; Chinese is out of scope for this mirror (user decision 2026-10-01)."
      approval: PROJECT-006
    - locator: "*/Solution*.*"
      reason: "Code files are not translated; the README code tabs are preserved verbatim."
      approval: PROJECT-002
  inventory: translation/state/source-map.yaml # generated by translation/tools/inventory.py
  order_policy: explicit-inventory # LeetCode by problem number, then CCI by chapter.section
mapping:
  - source: "solution/<range>/<dir>/README_EN.md"
    target: "vi/solution/<range>/<dir>/README.md"
    mode: mirror
    exclusions: []
  - source: "lcci/<dir>/README_EN.md"
    target: "vi/lcci/<dir>/README.md"
    mode: mirror
    exclusions: []
modules:
  source_adapter: translation/adapters/repo-docs.md
  format_adapters:
    - translation/formats/markdown-mdx.md
    - translation/formats/html.md
  domain_profiles:
    - translation/domains/algorithms.md
  workflows:
    - translation/workflows/translation.md
    - translation/workflows/upstream-sync.md
    - translation/workflows/release.md
policies:
  fidelity: faithful
  code_comments: preserve
  display_strings: preserve
  string_allowlist: []
  inline_literals: preserve
  markup_text_allowlist: [] # front matter is preserved verbatim (PROJECT-002)
  internal_links: verified_mapping # link strings kept; the site maps them (PROJECT-004)
  external_links: preserve
  image_text: preserve_and_report
  terminology: english_first_by_meaning
  translator_additions: disallow_in_translation
  language_exceptions:
    - locator: "H1 problem title"
      token: "official LeetCode/CCI problem name"
      reason: "Problem names stay as the official English title (PROJECT-001)."
      approval: PROJECT-001
    - locator: "code-tab headings (#### Python3 ...) inside <!-- tabs -->"
      token: "language names"
      reason: "Tab labels consumed by the site engine (PROJECT-003)."
      approval: PROJECT-003
    - locator: "[中文文档](...) / [English Version](...) switch line"
      token: "link label"
      reason: "Version-switch line is kept verbatim and removed by the site (PROJECT-004)."
      approval: PROJECT-004
  source_corrections: report_only
  newline_normalization: none
execution:
  mode: sequential
  max_workers: 1
  unit_policy: whole-file
  review_mode: sequential-self-review
  semantic_review_scope: full
  retry_failed_units_only: true
  state_root: translation/state
permissions:
  protected_paths:
    - solution/**
    - lcof/**
    - lcof2/**
    - lcci/**
    - lcp/**
    - lcs/**
    - basic/**
    - images/**
    - README.md
    - README_EN.md
  coordinator_write:
    - translation/PROJECT_CONTEXT.yaml
    - translation/PROJECT_RULES.md
    - translation/GLOSSARY.md
    - translation/domains/algorithms.md
    - translation/state/**
  worker_write:
    - "vi/solution/*/*/README.md (assigned unit only)"
    - "vi/lcci/*/README.md (assigned unit only)"
    - "translation/state/units/<assigned unit>.yaml"
  reviewer_write:
    - translation/state/reviews/**
  integrator_write:
    - vi/**
    - translation/state/**
  authorization_reference: "User request, Claude Code session 2026-10-01: Vietnamese docs mirror + language toggle + CI/CD; scope approved: infrastructure + 3-unit pilot; hosting changed to Vercel (all three sites) in the same session."
site:
  enabled: true
  output_base: "<site url>/vi/"
  route_mapping: "lc/{num}/ and lcci/{num}/ are shared by the zh, en and vi sites; vi pages are generated by vi/site/build_vi.py"
  missing_translation: labelled_stub # minimal stub page (vi_stub.html) with links to English/中文, noindex, outside nav, search and sitemap
  ui_changes_authorized: true # same user request; overlay lives in vi/site/, vercel.json and .github/workflows/vi-site.yml
validation:
  checks:
    - id: source_protection
      required: true
      method: "git status --porcelain -- solution lcof lcof2 lcci lcp lcs basic images README.md README_EN.md  (must print nothing)"
    - id: full_semantic_review
      required: true
      method: "Đối chiếu toàn bộ owned source và target hai chiều theo coverage map."
    - id: protected_spans
      required: true
      method: "python3 translation/tools/check_vi.py <target>  (front matter, code fences, inline code, math, markers, example data)"
    - id: structure
      required: true
      method: "python3 translation/tools/check_vi.py <target>  (heading levels, H1, code-tab headings, HTML structure) + python3 scripts/check_thinking.py <target>"
    - id: links_and_assets
      required: true
      method: "python3 translation/tools/check_vi.py <target>  (URL multiset) + render: python3 vi/site/prepare.py --only <unit> && mkdocs build -f mkdocs-site-vi.yml in vi/site/.work"
    - id: residual_language
      required: true
      method: "Phân loại mọi hit `warn: residual_english` của check_vi.py và mọi đoạn prose còn tiếng Anh theo policy và allowlist."
  conditional_checks:
    - id: inventory_gate
      method: "python3 translation/tools/inventory.py --check  (no unreviewed/modified/orphan targets on main)"
    - id: site_build
      method: ".github/workflows/vi-site.yml (unit tests, translation checks, vi build); Vercel builds zh/en/vi with vi/site/vercel-build.sh on main"
    - id: publish_gate
      method: "vi/site/build_vi.py publishes a translation only when its unit report is verified and target.sha256 matches; otherwise the stub is served"
git:
  commit: false
  push: false
  deploy: false
  branch: feat/vi-docs-mirror
  remote: origin
  authorization_reference: null # commit/push need an explicit request from the user
  unit_commit_policy: after_verified # PROJECT-005: only verified translations land on main
release:
  kind: bilingual-site
  output: "Vercel project of the fork: / (中文), /en/ (English), /vi/ (Tiếng Việt)"
  archive: null
  include_source_material: false
setup_blockers: []
